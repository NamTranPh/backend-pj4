# Set up Connection
server:
  port: ${SERVER_PORT:3004} # lấy từ .env, default 3004

spring:
  application:
    name: backend-pj4

  # Ép bật log màu trong console (mặc định DETECT thường ra trắng trên Windows)
  output:
    ansi:
      enabled: always

  flyway:
    enabled: false # Dùng tạo bảng bằng flyway đọc file resources/database/migration/ .sql tạo csdl chưa dùng

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false # Không dùng Redis repository -> tắt để bỏ đống cảnh báo khi khởi động

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5000MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:5000MB}

  jpa:
    # false theo AGENTS.md §13: mặc định của Spring Boot là true, giữ session mở suốt request
    # nên lazy loading ở tầng view vẫn chạy được và che mất chỗ nạp dữ liệu thiếu. Tắt đi thì
    # chỗ nào nạp thiếu sẽ lộ ngay bằng LazyInitializationException thay vì âm thầm bắn thêm query.
    open-in-view: false
    hibernate:
      # production đặt JPA_DDL_AUTO=validate (AGENTS.md §33 cấm update ở production)
      ddl-auto: ${JPA_DDL_AUTO:update}
    # bật JPA_SHOW_SQL=true khi cần đếm số câu truy vấn thật
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false # True -> Hibernate show SQL — mỗi lần JPA query DB nó in ra câu SQL, False thì tắt đi
    database-platform: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:3004}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
  expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  issuer: ${JWT_ISSUER:http://localhost:3004}
  reuse-grace-seconds: ${JWT_REUSE_GRACE_SECONDS:10}

auth:
  cookie:
    refresh-name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    domain: ${AUTH_COOKIE_DOMAIN:}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

    refresh-path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
    admin-refresh-name: ${AUTH_ADMIN_REFRESH_COOKIE_NAME:admin_refresh_token}
    admin-refresh-path: ${AUTH_ADMIN_REFRESH_COOKIE_PATH:/api/v1/admin/auth}
  otp:
    length: ${AUTH_OTP_LENGTH:6}
    ttl-minutes: ${AUTH_OTP_TTL_MINUTES:5}
    resend-cooldown-seconds: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    pepper: ${AUTH_OTP_PEPPER:dev-only-otp-pepper}
  password:
    # Admin do quản trị viên tự tạo nên giữ ngưỡng cơ bản; đăng ký công khai siết chặt hơn
    min-length-user: ${AUTH_PASSWORD_MIN_LENGTH_USER:8}
    min-length-admin: ${AUTH_PASSWORD_MIN_LENGTH_ADMIN:6}
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  login:
    max-failures: ${AUTH_LOGIN_MAX_FAILURES:6}
    failure-window-minutes: ${AUTH_LOGIN_FAILURE_WINDOW_MINUTES:10}
    lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:10}

# PayOS và phát video HLS.
# Thiếu section này thì @ConfigurationProperties(prefix = "app.payos") và "app.playback" không
# nhận được gì từ .env: biến PAYOS_CLIENT_ID chỉ map được tới payos.client-id, thiếu tiền tố "app.".
app:
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
    payment-link-ttl-minutes: ${PAYOS_PAYMENT_LINK_TTL_MINUTES:15}
    reconcile-interval-ms: ${PAYOS_RECONCILE_INTERVAL_MS:300000}
    reconcile-batch-limit: ${PAYOS_RECONCILE_BATCH_LIMIT:100}
    reconcile-lookback-hours: ${PAYOS_RECONCILE_LOOKBACK_HOURS:720}
  cache:
    # TTL khong phai co che lam moi du lieu: co binh luan moi thi version key tang len va cache
    # cu thanh mo coi ngay. TTL chi de nhung khoa mo coi do tu chet.
    comment-list-ttl: ${COMMENT_LIST_CACHE_TTL:60s}
    rating-summary-ttl: ${RATING_SUMMARY_CACHE_TTL:300s}
    like-flush-interval-ms: ${LIKE_FLUSH_INTERVAL_MS:300000}
  playback:
    # Để rỗng chứ không đặt giá trị giả: rỗng thì ConfigurationWarningLogger báo ngay,
    # còn giá trị giả sẽ ký token bằng khoá ai cũng đoán được.
    token-secret: ${PLAYBACK_TOKEN_SECRET:}
    token-ttl-seconds: ${PLAYBACK_TOKEN_TTL_SECONDS:300}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

redis:
  key:
    prefix: ${REDIS_KEY_PREFIX:backend-pj4}

# MinIO (object storage)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123}
  bucket-raw: ${MINIO_BUCKET_RAW:movie-raw}
  bucket-processed: ${MINIO_BUCKET_PROCESSED:movie-processed}
  bucket-public: ${MINIO_BUCKET_PUBLIC:movie-public}
  bucket-avatar: ${MINIO_BUCKET_AVATAR:avatars}

mail:
  from-address: ${MAIL_FROM_ADDRESS:no-reply@localhost}
  from-name: ${MAIL_FROM_NAME:System}

# Actuator health check (DB / Redis / MinIO)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # production đặt ACTUATOR_HEALTH_DETAILS=when-authorized để không lộ chi tiết thành phần
      show-details: ${ACTUATOR_HEALTH_DETAILS:always}
      show-components: always

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    enabled: true
    operationsSorter: method
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.movieapi: DEBUG
    org.springframework.security: DEBUG
